[package]
name = "codex-gui-desktop"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "=0.23.1"
codex-gui-core = { path = "../core" }
fontdb = "=0.23.0"
image = { version = "=0.25.10", default-features = false, features = ["bmp", "gif", "jpeg", "png", "tiff", "webp"] }
notify-rust = { version = "=4.19.0", features = ["preview-macos-un"] }
open = "=5.4.5"
percent-encoding = "2"
pulldown-cmark = { version = "0.13", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shlex = "2"
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "=2.7.3"
tempfile = "3"
tokio = { version = "1", features = ["macros", "process", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
dunce = "1"
windows = { version = "0.62", features = ["UI_Notifications"] }

[target.'cfg(target_os = "macos")'.dependencies]
mac-usernotifications = "=0.3.1"

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
rodio = { version = "=0.22.2", default-features = false, features = ["playback"] }

[target.'cfg(target_os = "linux")'.dependencies]
gstreamer = { version = "0.25", features = ["v1_22"] }
gstreamer-sdp = { version = "0.25", features = ["v1_22"] }
gstreamer-webrtc = { version = "=0.25.4", features = ["v1_22"] }
