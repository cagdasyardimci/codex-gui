name: Desktop checks

on:
  push:
    paths:
      - ".github/workflows/desktop-core.yml"
      - "desktop/**"
      - "LICENSE.md"
      - "Tests/E2E/MockBackend/**"
  pull_request:
    paths:
      - ".github/workflows/desktop-core.yml"
      - "desktop/**"
      - "LICENSE.md"
      - "Tests/E2E/MockBackend/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    name: Core on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Check Rust formatting
        working-directory: desktop
        run: cargo fmt --all --check
      - name: Check the core
        working-directory: desktop
        run: cargo check-core
      - name: Lint the core
        working-directory: desktop
        run: cargo clippy --locked -p codex-gui-core --all-targets -- -D warnings
      - name: Run Rust tests
        working-directory: desktop
        run: cargo test --locked -p codex-gui-core
      - name: Run the portable fixture test
        run: python -m unittest discover -s desktop/fixtures -v
      - name: Verify Windows sandbox setup from a fresh user profile
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build --manifest-path desktop/Cargo.toml --locked -p codex-gui-core --example windows_sandbox
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./desktop/fixtures/verify_windows_sandbox.ps1 -Probe desktop/target/debug/examples/windows_sandbox.exe

  desktop:
    name: Desktop build on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: desktop/.node-version
          package-manager-cache: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          package_json_file: desktop/frontend/package.json
      - name: Install Linux WebView dependencies
        if: runner.os == 'Linux'
        run: |
          sources="$RUNNER_TEMP/ubuntu-desktop.sources"
          sed 's|^URIs: .*|URIs: https://archive.ubuntu.com/ubuntu/|' \
            /etc/apt/sources.list.d/ubuntu.sources > "$sources"
          apt_options=(-o "Dir::Etc::sourcelist=$sources" -o Dir::Etc::sourceparts=- -o Acquire::Retries=1 -o Acquire::http::Timeout=25 -o Acquire::https::Timeout=25)
          sudo timeout 150s apt-get "${apt_options[@]}" -o APT::Update::Error-Mode=any update
          sudo timeout 480s apt-get "${apt_options[@]}" install -y --no-install-recommends libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libgtk-3-bin xvfb xauth
      - name: Install frontend dependencies
        working-directory: desktop/frontend
        run: pnpm install --frozen-lockfile
      - name: Check frontend types
        working-directory: desktop/frontend
        run: pnpm check
      - name: Build the desktop shell
        working-directory: desktop/frontend
        run: pnpm tauri build --debug --no-bundle -- --locked
      - name: Run desktop host tests
        working-directory: desktop
        run: cargo test --locked -p codex-gui-desktop --features tauri/custom-protocol
      - name: Verify Unicode streaming through the WebView
        shell: bash
        env:
          RUST_BACKTRACE: "1"
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            xvfb-run -a python desktop/fixtures/verify_webview_fixture.py desktop/target/debug/codex-gui-desktop
          elif [[ "$RUNNER_OS" == Windows ]]; then
            python desktop/fixtures/verify_webview_fixture.py desktop/target/debug/codex-gui-desktop.exe
          else
            python3 desktop/fixtures/verify_webview_fixture.py desktop/target/debug/codex-gui-desktop
          fi
      - name: Bundle the diagnostic shell
        working-directory: desktop/frontend
        env:
          APPLE_SIGNING_IDENTITY: "-"
        run: pnpm tauri bundle --debug --ci
      - name: Verify the Mac disk image
        if: runner.os == 'macOS'
        shell: bash
        run: |
          shopt -s nullglob
          images=(desktop/target/debug/bundle/dmg/*.dmg)
          test "${#images[@]}" -eq 1
          hdiutil verify "${images[0]}"
          mount_dir="$(mktemp -d)"
          hdiutil attach -nobrowse -readonly -mountpoint "$mount_dir" "${images[0]}"
          trap 'hdiutil detach "$mount_dir"' EXIT
          app="$mount_dir/Codex GUI Beta.app"
          codesign --verify --deep --strict "$app"
          python3 desktop/fixtures/verify_bundle_notices.py "$app/Contents/Resources/notices"
          python3 desktop/fixtures/verify_webview_fixture.py "$app/Contents/MacOS/codex-gui-desktop"
          python3 desktop/fixtures/verify_webview_fixture.py "$app/Contents/MacOS/codex-gui-desktop" --media
          python3 desktop/fixtures/verify_history_fixture.py "$app/Contents/MacOS/codex-gui-desktop"
          python3 desktop/fixtures/verify_composer_attachment_fixture.py "$app/Contents/MacOS/codex-gui-desktop"
          python3 desktop/fixtures/verify_composer_attachment_fixture.py "$app/Contents/MacOS/codex-gui-desktop" --annotations
          python3 desktop/fixtures/verify_composer_attachment_fixture.py "$app/Contents/MacOS/codex-gui-desktop" --context
          python3 desktop/fixtures/verify_composer_attachment_fixture.py "$app/Contents/MacOS/codex-gui-desktop" --settings
          python3 desktop/fixtures/verify_composer_attachment_fixture.py "$app/Contents/MacOS/codex-gui-desktop" --project-context
          python3 desktop/fixtures/verify_composer_attachment_fixture.py "$app/Contents/MacOS/codex-gui-desktop" --slash-commands
          python3 desktop/fixtures/verify_composer_attachment_fixture.py "$app/Contents/MacOS/codex-gui-desktop" --prompt-revision
          python3 desktop/fixtures/verify_account_fixture.py "$app/Contents/MacOS/codex-gui-desktop"
          python3 desktop/fixtures/verify_windows_setup_fixture.py "$app/Contents/MacOS/codex-gui-desktop"
          python3 desktop/fixtures/verify_turn_fixture.py "$app/Contents/MacOS/codex-gui-desktop"
          python3 desktop/fixtures/verify_queue_fixture.py "$app/Contents/MacOS/codex-gui-desktop"
          python3 desktop/fixtures/verify_diff_fixture.py "$app/Contents/MacOS/codex-gui-desktop"
          python3 desktop/fixtures/verify_quit_fixture.py "$app/Contents/MacOS/codex-gui-desktop"
          python3 desktop/fixtures/verify_coding_probe.py "$app/Contents/MacOS/codex-gui-desktop"
      - name: Verify the NSIS installation
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = @(Get-ChildItem desktop/target/debug/bundle/nsis/*.exe)
          if ($installer.Count -ne 1) { throw "Expected one NSIS installer" }
          $destination = Join-Path $env:RUNNER_TEMP "Installed Codex GUI Beta"
          $process = Start-Process $installer[0].FullName -ArgumentList @("/S", "/D=$destination") -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "NSIS exited with code $($process.ExitCode)" }
          python desktop/fixtures/verify_bundle_notices.py (Join-Path $destination "notices")
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $app = Join-Path $destination "codex-gui-desktop.exe"
          python desktop/fixtures/verify_webview_fixture.py $app
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python desktop/fixtures/verify_webview_fixture.py $app --media
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python desktop/fixtures/verify_composer_attachment_fixture.py $app
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python desktop/fixtures/verify_composer_attachment_fixture.py $app --annotations
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python desktop/fixtures/verify_composer_attachment_fixture.py $app --context
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python desktop/fixtures/verify_composer_attachment_fixture.py $app --settings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python desktop/fixtures/verify_composer_attachment_fixture.py $app --project-context
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python desktop/fixtures/verify_composer_attachment_fixture.py $app --slash-commands
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python desktop/fixtures/verify_composer_attachment_fixture.py $app --prompt-revision
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python desktop/fixtures/verify_account_fixture.py $app
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python desktop/fixtures/verify_windows_setup_fixture.py $app
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python desktop/fixtures/verify_turn_fixture.py $app
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python desktop/fixtures/verify_queue_fixture.py $app
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python desktop/fixtures/verify_diff_fixture.py $app
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python desktop/fixtures/verify_quit_fixture.py $app
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python desktop/fixtures/verify_coding_probe.py $app
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python desktop/fixtures/verify_history_fixture.py $app
      - name: Verify the Debian installation
        if: runner.os == 'Linux'
        shell: bash
        run: |
          shopt -s nullglob
          packages=(desktop/target/debug/bundle/deb/*.deb)
          test "${#packages[@]}" -eq 1
          artifact="$(realpath "${packages[0]}")"
          sudo timeout 480s apt-get -o "Dir::Etc::sourcelist=$RUNNER_TEMP/ubuntu-desktop.sources" \
            -o Dir::Etc::sourceparts=- -o Acquire::Retries=1 -o Acquire::https::Timeout=25 install -y "$artifact"
          installed="$(dpkg-deb -f "$artifact" Package)"
          license="$(dpkg -L "$installed" | grep -E '/notices/LICENSE\.md$')"
          python3 desktop/fixtures/verify_bundle_notices.py "$(dirname "$license")"
          app="$(command -v codex-gui-desktop)"
          xvfb-run -a python3 desktop/fixtures/verify_webview_fixture.py "$app"
          xvfb-run -a python3 desktop/fixtures/verify_webview_fixture.py "$app" --media
          xvfb-run -a python3 desktop/fixtures/verify_history_fixture.py "$app"
          xvfb-run -a python3 desktop/fixtures/verify_composer_attachment_fixture.py "$app"
          xvfb-run -a python3 desktop/fixtures/verify_composer_attachment_fixture.py "$app" --annotations
          xvfb-run -a python3 desktop/fixtures/verify_composer_attachment_fixture.py "$app" --context
          xvfb-run -a python3 desktop/fixtures/verify_composer_attachment_fixture.py "$app" --settings
          xvfb-run -a python3 desktop/fixtures/verify_composer_attachment_fixture.py "$app" --project-context
          xvfb-run -a python3 desktop/fixtures/verify_composer_attachment_fixture.py "$app" --slash-commands
          xvfb-run -a python3 desktop/fixtures/verify_composer_attachment_fixture.py "$app" --prompt-revision
          xvfb-run -a python3 desktop/fixtures/verify_account_fixture.py "$app"
          xvfb-run -a python3 desktop/fixtures/verify_windows_setup_fixture.py "$app"
          xvfb-run -a python3 desktop/fixtures/verify_turn_fixture.py "$app"
          xvfb-run -a python3 desktop/fixtures/verify_queue_fixture.py "$app"
          xvfb-run -a python3 desktop/fixtures/verify_diff_fixture.py "$app"
          xvfb-run -a python3 desktop/fixtures/verify_quit_fixture.py "$app"
          xvfb-run -a python3 desktop/fixtures/verify_coding_probe.py "$app"
      - name: Store diagnostic installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diagnostic-installer-${{ matrix.os }}-attempt-${{ github.run_attempt }}
          path: |
            desktop/target/debug/bundle/dmg/*.dmg
            desktop/target/debug/bundle/nsis/*.exe
            desktop/target/debug/bundle/deb/*.deb
          if-no-files-found: error
      - name: Prepare hosted ChatGPT sign-in
        if: runner.os != 'macOS' && github.event_name == 'push' && github.ref == 'refs/heads/tauri-migration' && github.actor == github.repository_owner && vars.CODEX_GUI_DEVICE_PUBLIC_KEY != '' && (vars.CODEX_GUI_DEVICE_TARGET == '' || vars.CODEX_GUI_DEVICE_TARGET == runner.os)
        shell: bash
        env:
          CODEX_GUI_DEVICE_PUBLIC_KEY: ${{ vars.CODEX_GUI_DEVICE_PUBLIC_KEY }}
        run: |
          npm install --prefix "$RUNNER_TEMP/codex-gui-hosted-turn/cli" --no-save --no-audit --no-fund --ignore-scripts @openai/codex@0.163.0
          if [[ "$RUNNER_OS" == Windows ]]; then
            cargo build --manifest-path desktop/Cargo.toml --locked -p codex-gui-core --example windows_sandbox
          fi
          python desktop/fixtures/hosted_coding_probe.py prepare
      - name: Store encrypted device handoff
        if: runner.os != 'macOS' && github.event_name == 'push' && github.ref == 'refs/heads/tauri-migration' && github.actor == github.repository_owner && vars.CODEX_GUI_DEVICE_PUBLIC_KEY != '' && (vars.CODEX_GUI_DEVICE_TARGET == '' || vars.CODEX_GUI_DEVICE_TARGET == runner.os)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: encrypted-device-${{ runner.os }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/codex-gui-hosted-turn/device.enc
          retention-days: 1
          if-no-files-found: error
      - name: Confirm hosted ChatGPT sign-in
        if: runner.os != 'macOS' && github.event_name == 'push' && github.ref == 'refs/heads/tauri-migration' && github.actor == github.repository_owner && vars.CODEX_GUI_DEVICE_PUBLIC_KEY != '' && (vars.CODEX_GUI_DEVICE_TARGET == '' || vars.CODEX_GUI_DEVICE_TARGET == runner.os)
        run: python desktop/fixtures/hosted_coding_probe.py authorize
      - name: Verify the signed-in installed coding turn
        if: runner.os != 'macOS' && github.event_name == 'push' && github.ref == 'refs/heads/tauri-migration' && github.actor == github.repository_owner && vars.CODEX_GUI_DEVICE_PUBLIC_KEY != '' && (vars.CODEX_GUI_DEVICE_TARGET == '' || vars.CODEX_GUI_DEVICE_TARGET == runner.os)
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            xvfb-run -a python desktop/fixtures/hosted_coding_probe.py finish
          else
            python desktop/fixtures/hosted_coding_probe.py finish
          fi
