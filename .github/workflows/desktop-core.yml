name: Desktop checks

on:
  push:
    paths:
      - ".github/workflows/desktop-core.yml"
      - "desktop/**"
      - "Tests/E2E/MockBackend/**"
  pull_request:
    paths:
      - ".github/workflows/desktop-core.yml"
      - "desktop/**"
      - "Tests/E2E/MockBackend/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    name: Core on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Check Rust formatting
        working-directory: desktop
        run: cargo fmt --all --check
      - name: Check the core
        working-directory: desktop
        run: cargo check-core
      - name: Lint the core
        working-directory: desktop
        run: cargo clippy --locked -p codex-gui-core --all-targets -- -D warnings
      - name: Run Rust tests
        working-directory: desktop
        run: cargo test --locked -p codex-gui-core
      - name: Run the portable fixture test
        run: python -m unittest discover -s desktop/fixtures -v

  desktop:
    name: Desktop build on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: desktop/.node-version
          package-manager-cache: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          package_json_file: desktop/frontend/package.json
      - name: Install Linux WebView dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Install frontend dependencies
        working-directory: desktop/frontend
        run: pnpm install --frozen-lockfile
      - name: Check frontend types
        working-directory: desktop/frontend
        run: pnpm check
      - name: Build the desktop shell
        working-directory: desktop/frontend
        run: pnpm tauri build --debug --no-bundle -- --locked
